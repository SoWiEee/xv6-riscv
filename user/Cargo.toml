[package]
name = "xv6-user"
version = "0.1.0"
edition = "2024"

# Profiles (panic = "abort") live in the workspace-root Cargo.toml; Cargo ignores
# profile keys in a non-root manifest. The build target is passed explicitly on
# every cargo invocation (--target riscv64imac-unknown-none-elf).

[dependencies]
xv6-user-lib = { path = "../user-lib" }

[[bin]]
name = "sh"
path = "src/bin/sh.rs"

[[bin]]
name = "ls"
path = "src/bin/ls.rs"

[[bin]]
name = "cat"
path = "src/bin/cat.rs"

[[bin]]
name = "init"
path = "src/bin/init.rs"

[[bin]]
name = "init_test"
path = "src/bin/init_test.rs"