[package]
name = "xv6-kernel"
version = "0.1.0"
edition = "2024"

[build-dependencies]
cc = "1.0"

[dependencies]
riscv = { workspace = true }
tock-registers = { workspace = true }
bitflags = { workspace = true }
spin = { workspace = true }
linked_list_allocator = { workspace = true }
buddy_system_allocator = { workspace = true }
critical-section = { workspace = true }

[[bin]]
name = "xv6-kernel"
path = "src/bin/kernel.rs"

# NOTE: profiles, per-target rustflags/runner, and the default build target are
# NOT set here — Cargo ignores those keys in a non-root manifest. The active
# release/dev profiles (panic = "abort") live in the workspace-root Cargo.toml;
# the linker and rustflags live in .cargo/config.toml; the target is passed
# explicitly on every cargo invocation (--target riscv64imac-unknown-none-elf).
# zicsr/zifencei are part of the riscv64imac target's default features, so no
# extra rustflags are needed for CSR access.

[lib]
name = "xv6_kernel"